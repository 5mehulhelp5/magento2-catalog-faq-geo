name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    name: Create release ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Newest supported PHP, to match the leg CI runs PHPStan on: the analysis covers the
      # test suite, whose PHPUnit 12 attributes only exist where PHPUnit 12 can install.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, hash, openssl
          coverage: none
          tools: composer:v2

      - name: Add Magento repository
        run: |
          composer config repositories.magento composer https://repo.magento.com/
          composer config http-basic.repo.magento.com \
            "${{ secrets.MAGENTO_MARKETPLACE_PUBLIC_KEY }}" \
            "${{ secrets.MAGENTO_MARKETPLACE_PRIVATE_KEY }}"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-8.4-${{ hashFiles('composer.json') }}
          restore-keys: composer-8.4-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      # Idempotent: a release may already exist for this tag — it can be cut by hand, and
      # this repository's history has been rewritten before, which re-pushes every tag and
      # re-triggers this workflow. `gh release create` hard-fails on an existing release,
      # so re-running the job must not be what breaks the build.
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to create."
            exit 0
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
